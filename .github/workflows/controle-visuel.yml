# Captures de contrôle visuel du site — USAGE INTERNE, à la demande uniquement.
# Les images ne sont jamais versionnées : elles sont publiées comme artefact de
# run, conservé 7 jours puis supprimé automatiquement.
name: Contrôle visuel

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  captures:
    name: Captures d'écran du site
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build du site
        run: npm run build

      - name: Servir le build
        run: |
          npm run preview -- --port 5173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ >/dev/null && break
            sleep 1
          done

      # Le runner Ubuntu embarque Google Chrome : aucun téléchargement.
      - name: Captures à tous les formats
        run: npm run controle
        env:
          CANAL_NAVIGATEUR: chrome

      - name: Publier l'artefact (conservation 7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: controle-visuel
          path: controle-visuel/
          retention-days: 7
