<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Image de partage Noltan (1200 × 630)</title>
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/fraunces/wght-italic.css" />
    <style>
      /* Mêmes teintes que src/styles/global.css (ink / gold). */
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "Inter Variable", "Inter", system-ui, sans-serif;
        color: #ffffff;
        background:
          radial-gradient(900px 520px at 88% 8%, #182338 0%, rgba(24, 35, 56, 0) 70%),
          linear-gradient(180deg, #0f172a 0%, #070c16 100%);
        -webkit-font-smoothing: antialiased;
      }
      .filet {
        position: absolute;
        inset: 0 0 auto 0;
        height: 6px;
        background: linear-gradient(90deg, #a97f2c 0%, #e3c98a 45%, #c9a24b 100%);
      }
      .cadre {
        position: absolute;
        inset: 0;
        padding: 92px 96px 0 96px;
        box-sizing: border-box;
      }
      .marque {
        display: flex;
        align-items: center;
        gap: 22px;
        height: 72px;
      }
      .marque span {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 46px 0 0 0;
        font-size: 74px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.03em;
        max-width: 900px;
      }
      h1 em {
        font-family: "Fraunces Variable", "Fraunces", Georgia, serif;
        font-style: italic;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #e3c98a;
      }
      p {
        margin: 34px 0 0 0;
        font-size: 28px;
        line-height: 1.4;
        font-weight: 400;
        color: #94a3b8;
        max-width: 880px;
      }
      .domaine {
        position: absolute;
        left: 96px;
        bottom: 52px;
        font-size: 22px;
        color: #64748b;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="filet"></div>
    <div class="cadre">
      <div class="marque">
        <!-- Marque Noltan : même dessin que src/components/site/Logo.tsx (MarqueNoltan). -->
        <svg width="72" height="72" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect
            x="0.5"
            y="0.5"
            width="27"
            height="27"
            rx="7.5"
            fill="#070c16"
            stroke="#ffffff"
            stroke-opacity="0.14"
          />
          <path
            d="M9.5 6.5h7.2l4.3 4.3v10a1.7 1.7 0 0 1-1.7 1.7H9.5a1.7 1.7 0 0 1-1.7-1.7V8.2a1.7 1.7 0 0 1 1.7-1.7Z"
            fill="#F4EFE4"
          />
          <path d="M16.7 6.5 21 10.8h-4.3V6.5Z" fill="#c9a24b" />
          <rect x="10.3" y="13" width="7.4" height="1.6" rx="0.8" fill="#a97f2c" />
          <rect x="10.3" y="16" width="5.6" height="1.6" rx="0.8" fill="#a97f2c" />
          <rect x="10.3" y="19" width="6.5" height="1.6" rx="0.8" fill="#a97f2c" />
        </svg>
        <span>Noltan</span>
      </div>
      <h1>L'<em>espace de travail</em><br />du conseiller en gestion de patrimoine</h1>
      <p>Clients, rendez-vous, documents et suivi des dossiers — dans un seul outil, installé chez vous.</p>
    </div>
    <div class="domaine">noltan.fr</div>
  </body>
</html>
